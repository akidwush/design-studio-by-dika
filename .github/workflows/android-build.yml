name: Android APK
on:
  push:
    branches: [main, work, 'develop', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/android-tools.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/nexora-sdk-tools"
          SDK_MANAGER="$RUNNER_TEMP/nexora-sdk-tools/cmdline-tools/bin/sdkmanager"
          python3 -c 'print("y\n" * 100)' | "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses > sdk-licenses.log 2>&1
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee sdk-setup.log
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify audited upstream sources
        run: python3 tools/verify_vendored.py
      - name: Unit tests, lint and debug APK
        shell: bash
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug 2>&1 | tee android-build.log
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: nexora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-build-reports
          path: |
            android-build.log
            sdk-licenses.log
            sdk-setup.log
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
